name: Spot — Madar automatic approval
run-name: Spot — ${{ github.event_name }}

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'scripts/**'
      - '**.md'
      - '**.txt'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spot-madar-release
  cancel-in-progress: false

env:
  OWNER_HUB_URL: ${{ vars.OWNER_HUB_URL }}
  OWNER_HUB_APP_ID: ${{ vars.OWNER_HUB_APP_ID }}

jobs:
  candidate:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Automatically prepare private review from this exact commit
        run: node scripts/madar-auto.mjs submit
        env:
          OWNER_HUB_TOKEN: ${{ secrets.OWNER_HUB_TOKEN }}
          OWNER_HUB_SITE_ACCESS: ${{ secrets.OWNER_HUB_SITE_ACCESS }}

  approved:
    needs: candidate
    if: always() && (needs.candidate.result == 'success' || github.event_name != 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      ready: ${{ steps.release.outputs.ready }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Allow a short review window after a new upload
        if: github.event_name == 'push'
        run: |
          for attempt in $(seq 1 12); do
            node scripts/madar-auto.mjs approved > /dev/null
            if grep -q '^ready=true$' "$GITHUB_OUTPUT"; then break; fi
            sleep 20
          done
        env:
          OWNER_HUB_TOKEN: ${{ secrets.OWNER_HUB_TOKEN }}
          OWNER_HUB_SITE_ACCESS: ${{ secrets.OWNER_HUB_SITE_ACCESS }}
      - name: Get the latest exact approved release from Madar
        id: release
        run: node scripts/madar-auto.mjs approved
        env:
          OWNER_HUB_TOKEN: ${{ secrets.OWNER_HUB_TOKEN }}
          OWNER_HUB_SITE_ACCESS: ${{ secrets.OWNER_HUB_SITE_ACCESS }}

  publish:
    needs: approved
    if: always() && needs.approved.result == 'success' && needs.approved.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      RELEASE_VERSION: ${{ needs.approved.outputs.version }}
      RELEASE_COMMIT: ${{ needs.approved.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require the exact reviewed commit
        run: node scripts/release-gate.mjs check
        env:
          OWNER_HUB_TOKEN: ${{ secrets.OWNER_HUB_TOKEN }}
          OWNER_HUB_SITE_ACCESS: ${{ secrets.OWNER_HUB_SITE_ACCESS }}
      - name: Verify version routing and backend before publication
        run: node scripts/release-gate.mjs preflight-spot
        env:
          OWNER_HUB_TOKEN: ${{ secrets.OWNER_HUB_TOKEN }}
          OWNER_HUB_SITE_ACCESS: ${{ secrets.OWNER_HUB_SITE_ACCESS }}
      - name: Prepare the same approved files
        run: node scripts/prepare-spot-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Recheck approval immediately before Pages
        run: node scripts/release-gate.mjs check
        env:
          OWNER_HUB_TOKEN: ${{ secrets.OWNER_HUB_TOKEN }}
          OWNER_HUB_SITE_ACCESS: ${{ secrets.OWNER_HUB_SITE_ACCESS }}
      - name: Deploy approved files
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify Pages serves the exact approved commit
        run: node scripts/verify-spot-deployment.mjs
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
      - name: Activate release for Spot users and record publication
        run: node scripts/release-gate.mjs publish-spot
        env:
          OWNER_HUB_TOKEN: ${{ secrets.OWNER_HUB_TOKEN }}
          OWNER_HUB_SITE_ACCESS: ${{ secrets.OWNER_HUB_SITE_ACCESS }}
